<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#171F2D" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4B36B" />
      <stop offset="100%" stop-color="#E7CF9B" />
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg2)" />

  <!-- Center Mobile Phone Mockup -->
  <g filter="url(#shadow2)" transform="translate(260, 25)">
    <!-- Device Body -->
    <rect width="280" height="450" rx="36" fill="#171F2D" stroke="rgba(212, 179, 107, 0.4)" stroke-width="2" />
    <!-- Screen -->
    <rect x="12" y="12" width="256" height="426" rx="26" fill="#0B1220" />
    <!-- Dynamic Island / Speaker -->
    <rect x="98" y="20" width="84" height="18" rx="9" fill="#111827" />

    <!-- App Header -->
    <g transform="translate(24, 52)">
      <text x="0" y="14" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">Kopi Sentra POS</text>
      <text x="0" y="28" fill="#D4B36B" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Shift 01 • Meja Kasir Utama</text>
      <rect x="180" y="2" width="50" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)" />
      <text x="188" y="15" fill="#10B981" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700">ONLINE</text>
    </g>

    <!-- Quick Stats -->
    <g transform="translate(24, 94)">
      <rect width="110" height="48" rx="8" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
      <text x="10" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Omzet Shift Ini</text>
      <text x="10" y="38" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Rp 1.450.000</text>

      <g transform="translate(122, 0)">
        <rect width="110" height="48" rx="8" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
        <text x="10" y="18" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">Transaksi Selesai</text>
        <text x="10" y="38" fill="#D4B36B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">48 Cup</text>
      </g>
    </g>

    <!-- Product Grid -->
    <g transform="translate(24, 156)">
      <!-- Item 1 -->
      <rect width="110" height="96" rx="8" fill="#171F2D" stroke="rgba(212, 179, 107, 0.2)" />
      <rect x="10" y="10" width="32" height="32" rx="6" fill="rgba(212, 179, 107, 0.15)" />
      <text x="18" y="32" font-size="16">☕</text>
      <text x="10" y="60" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10">Aren Latte</text>
      <text x="10" y="74" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">22k • Stok: 42</text>
      <rect x="76" y="66" width="24" height="20" rx="4" fill="url(#gold2)" />
      <text x="84" y="80" fill="#0B1220" font-weight="800" font-size="12">+</text>

      <!-- Item 2 -->
      <g transform="translate(122, 0)">
        <rect width="110" height="96" rx="8" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
        <rect x="10" y="10" width="32" height="32" rx="6" fill="rgba(212, 179, 107, 0.15)" />
        <text x="18" y="32" font-size="16">🧊</text>
        <text x="10" y="60" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10">Cold Brew</text>
        <text x="10" y="74" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="8">26k • Stok: 18</text>
        <rect x="76" y="66" width="24" height="20" rx="4" fill="#1F2A3D" />
        <text x="84" y="80" fill="#F5F3EE" font-weight="800" font-size="12">+</text>
      </g>
    </g>

    <!-- Cart Summary Bottom Bar -->
    <g transform="translate(24, 360)">
      <rect width="232" height="54" rx="10" fill="url(#gold2)" />
      <text x="16" y="24" fill="#0B1220" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9">Pesanan Aktif (3 Item)</text>
      <text x="16" y="42" fill="#0B1220" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13">Rp 74.000</text>
      <rect x="144" y="12" width="76" height="30" rx="6" fill="#0B1220" />
      <text x="156" y="32" fill="#D4B36B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10">Bayar →</text>
    </g>
  </g>
</svg>
