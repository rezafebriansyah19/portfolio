<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#171F2D" />
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg5)" />

  <g filter="url(#shadow5)" transform="translate(60, 40)">
    <rect width="680" height="420" rx="8" fill="#171F2D" stroke="rgba(212, 179, 107, 0.25)" stroke-width="1.5" />
    <rect width="680" height="36" rx="8" fill="#111827" />
    <circle cx="20" cy="18" r="5" fill="#EF4444" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#F59E0B" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#10B981" opacity="0.8" />
    <text x="80" y="22" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">binaciptakarya.co.id</text>

    <!-- Content -->
    <rect x="0" y="36" width="680" height="384" fill="#0B1220" />
    <rect x="30" y="56" width="620" height="150" rx="6" fill="#171F2D" />
    <text x="50" y="85" fill="#D4B36B" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10">KONTRAKTOR &amp; REKAYASA TEKNIK SIPIL</text>
    <text x="50" y="120" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="20">PT Bina Cipta Karya</text>
    <text x="50" y="145" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Membangun Fondasi Infrastruktur Berkualitas dengan Standar Keamanan Tinggi.</text>

    <!-- 3 Projects -->
    <g transform="translate(30, 226)">
      <rect width="190" height="170" rx="6" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
      <text x="16" y="30" fill="#D4B36B" font-size="18">🏗️</text>
      <text x="16" y="60" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Gedung Bertingkat</text>
      <text x="16" y="80" fill="#94A3B8" font-size="10">Struktur beton bertulang tahan gempa.</text>

      <g transform="translate(215, 0)">
        <rect width="190" height="170" rx="6" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
        <text x="16" y="30" fill="#D4B36B" font-size="18">🌉</text>
        <text x="16" y="60" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Jembatan &amp; Jalan</text>
        <text x="16" y="80" fill="#94A3B8" font-size="10">Akses penghubung logistik daerah.</text>
      </g>

      <g transform="translate(430, 0)">
        <rect width="190" height="170" rx="6" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
        <text x="16" y="30" fill="#D4B36B" font-size="18">🏭</text>
        <text x="16" y="60" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12">Kawasan Industri</text>
        <text x="16" y="80" fill="#94A3B8" font-size="10">Pergudangan &amp; instalasi MEP.</text>
