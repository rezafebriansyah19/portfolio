        <text x="14" y="56" fill="#3B82F6" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="28">A-024</text>
        <text x="110" y="44" fill="#F5F3EE" font-size="9" font-weight="700">dr. Siti Rahma, Sp.A</text>
        <text x="110" y="58" fill="#94A3B8" font-size="8">Poli Anak • Sedang Masuk</text>
        <rect x="14" y="66" width="194" height="6" rx="3" fill="#1F2A3D" />
        <rect x="14" y="66" width="130" height="6" rx="3" fill="#3B82F6" />
      </g>

      <!-- Doctor Booking List -->
      <g transform="translate(0, 146)">
        <text x="0" y="12" fill="#F5F3EE" font-weight="700" font-size="11">Dokter Tersedia Hari Ini</text>
        
        <!-- Doc 1 -->
        <g transform="translate(0, 22)">
          <rect width="222" height="52" rx="6" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
          <circle cx="26" cy="26" r="14" fill="rgba(212, 179, 107, 0.2)" />
          <text x="22" y="31" font-size="12">🩺</text>
          <text x="48" y="22" fill="#F5F3EE" font-weight="700" font-size="10">dr. Hendra Wijaya</text>
          <text x="48" y="36" fill="#94A3B8" font-size="8">Dokter Umum • Sisa 4 Kuota</text>
          <rect x="164" y="14" width="46" height="24" rx="4" fill="#D4B36B" />
          <text x="174" y="29" fill="#0B1220" font-weight="700" font-size="9">Ambil</text>
        </g>

        <!-- Doc 2 -->
        <g transform="translate(0, 82)">
          <rect width="222" height="52" rx="6" fill="#171F2D" stroke="rgba(245, 243, 238, 0.08)" />
          <circle cx="26" cy="26" r="14" fill="rgba(16, 185, 129, 0.2)" />
          <text x="22" y="31" font-size="12">🦷</text>
          <text x="48" y="22" fill="#F5F3EE" font-weight="700" font-size="10">drg. Amanda Putri</text>
          <text x="48" y="36" fill="#94A3B8" font-size="8">Poli Gigi • Sisa 2 Kuota</text>
          <rect x="164" y="14" width="46" height="24" rx="4" fill="#D4B36B" />
          <text x="174" y="29" fill="#0B1220" font-weight="700" font-size="9">Ambil</text>
