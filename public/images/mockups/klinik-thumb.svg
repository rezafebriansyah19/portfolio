<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="100%" stop-color="#171F2D" />
    </linearGradient>
    <filter id="shadow6" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg6)" />

  <!-- Mobile Clinic Mockup -->
  <g filter="url(#shadow6)" transform="translate(265, 25)">
    <rect width="270" height="450" rx="36" fill="#171F2D" stroke="rgba(59, 130, 246, 0.4)" stroke-width="2" />
    <rect x="10" y="10" width="250" height="430" rx="28" fill="#0B1220" />
    <rect x="95" y="18" width="80" height="16" rx="8" fill="#111827" />

    <!-- Content -->
    <g transform="translate(24, 50)">
      <text x="0" y="16" fill="#F5F3EE" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14">Klinik Sehat Keluarga</text>
      <text x="0" y="32" fill="#94A3B8" font-family="'Plus Jakarta Sans', sans-serif" font-size="9">Pemesanan Antrean Online</text>

      <!-- Active Queue Box -->
      <g transform="translate(0, 48)">
        <rect width="222" height="84" rx="8" fill="#171F2D" stroke="rgba(59, 130, 246, 0.3)" />
